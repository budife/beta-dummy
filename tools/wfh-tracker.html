<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="icon" type="image/png" href="../favicon.png">
  
  <!-- Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BETA WFH Tracker - Track your work from home schedule">
  <meta name="keywords" content="edm, wfh, tracker, schedule, remote work">
  <meta name="author" content="BETA">
  
  <!-- CSS -->
  <link rel="stylesheet" href="../css/tokens.css?v=6.16.25">
  <link rel="stylesheet" href="../css/theme.css?v=6.16.25">
  <link rel="stylesheet" href="../css/pages-wfh-tracker.css?v=1.3.0">
  <link rel="stylesheet" href="../css/controls.css?v=6.16.25">
  
  <title>WFH Tracker - BETA</title>
  <meta name="theme-color" content="#0f172a" />
  <!-- Font Awesome - Non-blocking load -->
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></noscript>
</head>
<body>
  <!-- Navigation Bar -->
  <header class="header" role="banner">
    <nav class="nav" role="navigation" aria-label="Main navigation">
      <!-- Home Button -->
      <div class="nav-left">
        <a href="../index.html" class="nav-link">
          <i class="fa-solid fa-home"></i>
          <span>Home</span>
        </a>
      </div>
      
      <div class="nav-right">
        <!-- Additional navigation items can be added here -->
      </div>
    </nav>
  </header>

  <main id="main-content" role="main" class="page">
    <div class="container">
      <!-- Page Title -->
      <div class="page-title">
        <h2>WFH Tracker</h2>
        <p>Click a date to change its status: Normal → WFH → WFO</p>
      </div>
      
      <!-- Legend -->
      <div class="legend">
        <div class="legend-item">
          <div class="legend-color wfh"></div>
          <span class="legend-text">WFH (Work From Home)</span>
        </div>
        <div class="legend-item">
          <div class="legend-color wfo"></div>
          <span class="legend-text">WFO (Work From Office)</span>
        </div>
        <div class="legend-item">
          <div class="legend-color holiday"></div>
          <span class="legend-text">Holiday</span>
        </div>
        <div class="legend-item">
          <div class="legend-color weekend"></div>
          <span class="legend-text">Weekend</span>
        </div>
        <div class="legend-item">
          <div class="legend-color joint-leave">
            <span>C</span>
          </div>
          <span class="legend-text">Joint Leave</span>
        </div>
        <div id="holiday-sync-status" class="holiday-sync-status" aria-live="polite">Holiday source: local fallback</div>
      </div>
      
      <div class="stars" id="stars"></div>
      <div class="calendar">
        <div class="calendar-header">
            <button id="prev-month">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
              </svg>
            </button>
            <h1 id="month-year"></h1>
            <div class="header-buttons">
              <button id="today-btn" title="Go to Today">Today</button>
              <button id="clear-month-btn" title="Clear this month">Clear</button>
              <button id="next-month">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                </svg>
              </button>
            </div>
          </div>
          <div id="calendar-days" class="days"></div>
        </div>
        <div id="holiday-description" class="holiday-description" hidden></div>
        
        <!-- Summary Statistics -->
        <div class="summary-stats">
          <h3>Monthly Statistics</h3>
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-value" id="total-days">0</div>
              <div class="stat-label">Total Days</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="work-days">0</div>
              <div class="stat-label">Work Days</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="holidays-count">0</div>
              <div class="stat-label">Holidays</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="wfh-percentage">0%</div>
              <div class="stat-label">WFH Percentage</div>
            </div>
          </div>
        </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" role="contentinfo">
    <div class="container">
      <div class="footer-content">
        <div class="footer-left">
          <p class="footer-text">&copy; <span id="footer-year">2025</span> BETA by <span>budife.psd</span></p>
        </div>
        <div class="footer-right">
        </div>
      </div>
    </div>
  </footer>

<script src="../js/footer.js" defer></script>
<script src="../js/version-config.js?v=6.16.25" defer></script>
<script src="../js/privacy-settings.js?v=6.16.19" defer></script>
<script src="../js/pages-wfh-tracker.js?v=1.3.0" defer></script>
</body>
</html>
